name: clos3

mgmt:
  network: clos3-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    ceos:
      image: ceos:4.31.5M
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    spine1:
      kind: ceos
      mgmt-ipv4: 172.30.30.10
    leaf1:
      kind: ceos
      mgmt-ipv4: 172.30.30.11
    leaf2:
      kind: ceos
      mgmt-ipv4: 172.30.30.12
    client1:
      kind: linux
      mgmt-ipv4: 172.30.30.101
    client2:
      kind: linux
      mgmt-ipv4: 172.30.30.102

  links:
    # Συνδέσεις Spine με Leaf (Underlay Fabric)
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]

    # Συνδέσεις Leaf με Clients (Access Ports)
    - endpoints: ["leaf1:eth2", "client1:eth1"]
    - endpoints: ["leaf2:eth2", "client2:eth1"]
