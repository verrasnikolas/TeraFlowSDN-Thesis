name: 5stage-clos

mgmt:
  network: 5-stage-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    ceos:
      image: ceos:4.31.5M
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    # --- SuperSpines (Core Stage) ---
    superspine1:
      kind: ceos
      mgmt-ipv4: 172.30.30.2
    superspine2:
      kind: ceos
      mgmt-ipv4: 172.30.30.3

    # --- Spines ---
    spine1:
      kind: ceos
      mgmt-ipv4: 172.30.30.11
    spine2:
      kind: ceos
      mgmt-ipv4: 172.30.30.12
    spine3:
      kind: ceos
      mgmt-ipv4: 172.30.30.13
    spine4:
      kind: ceos
      mgmt-ipv4: 172.30.30.14

    # --- Leaves ---
    leaf1:
      kind: ceos
      mgmt-ipv4: 172.30.30.21
    leaf2:
      kind: ceos
      mgmt-ipv4: 172.30.30.22
    leaf3:
      kind: ceos
      mgmt-ipv4: 172.30.30.23
    leaf4:
      kind: ceos
      mgmt-ipv4: 172.30.30.24

    # --- Clients ---
    client1:
      kind: linux
      mgmt-ipv4: 172.30.30.101
    client2:
      kind: linux
      mgmt-ipv4: 172.30.30.102
    client3:
      kind: linux
      mgmt-ipv4: 172.30.30.103
    client4:
      kind: linux
      mgmt-ipv4: 172.30.30.104

  links:
    # --- Clients to Leaves ---
    - endpoints: ["client1:eth1", "leaf1:eth2"]
    - endpoints: ["client2:eth1", "leaf2:eth2"]
    - endpoints: ["client3:eth1", "leaf3:eth2"]
    - endpoints: ["client4:eth1", "leaf4:eth2"]

    # --- Pod 1: Leaves (1,2) to Spines (1,2) ---
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth3", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth3", "spine2:eth2"]

    # --- Pod 2: Leaves (3,4) to Spines (3,4) ---
    - endpoints: ["leaf3:eth1", "spine3:eth1"]
    - endpoints: ["leaf3:eth3", "spine4:eth1"]
    - endpoints: ["leaf4:eth1", "spine3:eth2"]
    - endpoints: ["leaf4:eth3", "spine4:eth2"]

    # --- CORE TIER (SuperSpines - 1 link per Spine) ---
    - endpoints: ["spine1:eth3", "superspine1:eth1"]  # Plane 1
    - endpoints: ["spine3:eth3", "superspine1:eth2"]  # Plane 1

    - endpoints: ["spine2:eth3", "superspine2:eth1"]  # Plane 2
    - endpoints: ["spine4:eth3", "superspine2:eth2"]  # Plane 2